swagger: '2.0'
info:
  title: CoinRoutes SOR API
  description: API for the CoinRoutes SOR
  contact:
    email: support@CoinRoutes.com
  version: v4.3.18
host: sor.yourcompany.com
schemes:
- https
# basePath: /
consumes:
- application/json
produces:
- application/json
- application/json
- application/openapi+json
- text/csv
- application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Send the Authorization HTTP header with the value "Token yourauthtokenhere"
security:
- Bearer: []
paths:
  /api/client_orders/:
    get:
      operationId: api_client_orders_list
      description: List all Client Orders. Client Orders are top-level orders submitted
        by users and consist of one or more SOR orders.
      parameters:
        - name: created_at_after
          in: query
          description: Filter orders created after this date (YYYY-MM-DD).
          required: false
          type: string
          format: date
        - name: created_at_before
          in: query
          description: Filter orders created before this date (YYYY-MM-DD).
          required: false
          type: string
          format: date
        - name: updated_at_after
          in: query
          description: Filter orders updated after this date (YYYY-MM-DD).
          required: false
          type: string
          format: date
        - name: updated_at_before
          in: query
          description: Filter orders updated before this date (YYYY-MM-DD).
          required: false
          type: string
          format: date
        - name: currency_pair
          in: query
          description: Filter by trading pair (e.g. BTC-USD).
          required: false
          type: string
        - name: currency
          in: query
          description: Filter by currency code.
          required: false
          type: string
        - name: sequence__gte
          in: query
          description: Return orders with sequence greater than or equal to this value.
          required: false
          type: integer
        - name: sequence__lte
          in: query
          description: Return orders with sequence less than or equal to this value.
          required: false
          type: integer
        - name: order_type
          in: query
          description: Filter by order type (e.g. twap).
          required: false
          type: string
        - name: order_status
          in: query
          description: Filter by order status (e.g. open).
          required: false
          type: string
        - name: strategy
          in: query
          description: Filter by account group.
          required: false
          type: string
        - name: limit
          in: query
          description: Number of results to return per page.
          required: false
          type: integer
        - name: offset
          in: query
          description: The initial index from which to return the results.
          required: false
          type: integer
        - name: ordering
          in: query
          description: Which field to use when ordering the results.
          required: false
          type: string
          enum: 
            - created_at
            - client_order_id
            - quantity
            - currency_pair
            - executed_qty
            - limit_price
            - gross_consideration
            - net_consideration
            - parent_order__slug
            - pct_executed
            - last_update
            - pct_limit_away
            - pct_limit_relative
            - finished_at
            - owner__username
        - name: client_id
          in: query
          description: Filter orders by exchange account using the uniquie identifier.
          required: false
          type: string
      responses:
        '200':
          description: ''
          schema:
            required:
              - count
              - results
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  $ref: '#/definitions/ClientOrderResponse'
      tags:
        - api
    post:
      operationId: api_client_orders_create
      description: Creates a new client order and automatically creates and executes
        appropriate SOR orders.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/ClientOrder'
      responses:
        '201':
          description: |
            Client order accepted. The response contains the created order plus normalized and defaulted values.
            Algorithm-specific effective settings are returned in `cade_algo_params`; values in that object may be string encoded and may differ from legacy top-level fields.
          schema:
            $ref: '#/definitions/ClientOrderResponse'
          examples:
            application/json:
              id: 134175
              uid: 2b571033-f6e3-415e-9598-65e585d885ad
              order_type: smart post
              order_status: open
              currency_pair: BTC-USDT
              quantity: '0.0010000000000000'
              remaining_qty: 0.001
              side: buy
              strategy: simulator
              client_order_id: example-smart-post-001
              limit_price: '1.0000000000000000'
              exchanges:
                - sim_binance
              market_data_exchanges:
                - binance
              allow_limit_away: false
              executed_qty: null
              cade_algo_params:
                side: buy
                quantity: '0.0010000000000000'
                post_only: 'True'
                limit_price: '1.0000000000000000'
        '400':
          description: |
            Request validation failed. Each property normally maps a field name to one or more validation messages.

            Examples observed from the REST API include:

            ```json
            {"interval_sec":["This field is required for time pace orders"]}
            ```

            ```json
            {"stop_price":["This field is required for smart stop orders"]}
            ```

            ```json
            {"volume_constraint_pct":["This field is required for pov orders"]}
            ```

            ```json
            {"contra_product":["This field is required for spread orders"]}
            ```

            ```json
            {"pairs_ratio":["This field is required for pairs orders when market spread is disabled"]}
            ```

            ```json
            {"exchanges":["DMA Order can only trade on a single exchange"]}
            ```
          schema:
            $ref: '#/definitions/ClientOrderValidationError'
          examples:
            application/json:
              interval_sec:
                - This field is required for time pace orders
      tags:
        - api
    parameters: []
  /api/client_orders/close_all_positions/:
    post:
      operationId: api_client_orders_close_all_positions
      description: Close all open positions on the defined strategy.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - order_type
              - strategy
            properties:
              order_type:
                type: string
                description: The type of order to use when closing positions.
                enum:
                  - smart post
                  - sweep
              strategy:
                type: string
                description: The strategy name to assign to the generated orders.
      responses:
        '200':
          description: ''
          schema:
            type: object
            required:
              - success
              - failed
            properties:
              success:
                type: array
                items:
                  type: object
                  properties:
                    position_id:
                      type: integer
                    order_id:
                      type: integer
              failed:
                type: array
                items:
                  type: object
      tags:
        - api
    parameters: []
  /api/client_orders/{client_order_id}/:
    get:
      operationId: api_client_orders_read
      description: Fetch a specific Client Order. Client Orders are Top level orders
        submitted by users and consist of one or more SOR orders.
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/ClientOrderResponse'
      tags:
        - api
    parameters:
      - name: client_order_id
        in: path
        required: true
        type: string
        format: uuid
  /api/client_orders/{client_order_id}/cancel/:
    post:
      operationId: api_client_orders_cancel
      description: Cancels the given order. Parameters other than order ID will be
        ignored. Note that any SOR orders currently being routed may still end up
        executing.
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/ClientOrderResponse'
      tags:
        - api
    parameters:
      - name: client_order_id
        in: path
        required: true
        type: string
        format: uuid
  /api/client_orders/{client_order_id}/modifications/:
    get:
      operationId: api_client_orders_modifications
      description: 'Fetches modifications for a specific client order.'
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              type: object
              properties:
                username:
                  type: string
                id:
                  type: integer
                uid:
                  type: string
                client_order:
                  type: integer
                created_at:
                  type: string
                  format: date-time
                cade_modified_algo_params:
                  type: object
                  additionalProperties: true
                cade_pre_modified_algo_params:
                  type: object
                  additionalProperties: true
                notes:
                  type: string
                  x-nullable: true
                client_tags:
                  type: string
                  x-nullable: true
      tags:
        - api
    parameters:
      - name: client_order_id
        in: path
        required: true
        type: string
  /api/client_orders/{client_order_id}/modify/:
    post:
      operationId: api_client_orders_modify
      description: Used to modify client orders. Please note modification is done
        on a best effort basis and not all parameters are modifiable. All parameters
        below are optional and query will only be successful if at least 1 valid modifiable
        parameter is provided
      parameters:
        - name: data
          in: body
          required: true
          schema:
            type: object
            properties:
              quantity:
                type: string
              aggression:
                type: string
              limit_price:
                type: string
              exchanges:
                type: array
                items:
                  type: string
              contra_exchanges:
                type: array
                items:
                  type: string
              notes:
                type: string
              sweep_to:
                type: string
              post_only:
                type: boolean
              volume_constraint_pct:
                type: string
              bps_offset:
                type: string
              sweep_pct:
                type: string
              min_post_size:
                type: string
              max_post_size:
                type: string
              interval_sec:
                type: string
              duration_sec:
                type: string
              stop_price:
                type: string
              full_size:
                type: boolean
              spread_offset_pct:
                type: string
              risk_quantity:
                type: string
              sweep_trigger_mode:
                type: string
              sweep_trigger_threshold_pct:
                type: string
              pause_offset_pct:
                type: string
              balancing_bps_offset:
                type: string
              pairs_ratio:
                type: string
              pause_offset_ratio:
                type: string
              cancel_time:
                type: string
              pause_offset_value:
                type: string
              market_spread:
                type: string
              balancing_post_only:
                type: boolean
              balancing_aggression:
                type: string
              disable_ioc_catchup:
                type: boolean
              lead_reduce_only:
                type: boolean
              price_range:
                type: string
              progression_increment:
                type: string
              progression_mode:
                type: string
              paused:
                type: boolean
              bookstats_quantity_target:
                title: Bookstats quantity target
                description: |
                  **Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop & POV.**
                  Determines how the algorithm sizes child orders relative to visible liquidity.

                  - **average**: Uses the average quantity across the target exchange's top n levels.
                  - **large**: Uses the average quantity of the largest m quantities within the target exchange's top n levels.
                  - **average_all**: Uses the average quantity across the aggregated book's top n levels.
                  - **large_all**: Uses the average quantity of the largest m quantities within the aggregated book's top n levels.

                  The values n and m are dynamically determined by the algorithm.
                type: string
                enum:
                  - average
                  - large
                  - average_all
                  - large_all
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/ClientOrderResponse'
        '400':
          description: Error on invalid modifiable parameters
          examples:
            application/json:
              aggression:
                - '''hello'' not a valid aggression.'
              limit_price:
                - Not a valid limit_price.
      tags:
        - api
    parameters:
    - name: client_order_id
      in: path
      required: true
      type: string
  /api/client_orders/{client_order_id}/sor_orders/:
    get:
      operationId: api_client_orders_sor_orders
      description: 'Get all SOR orders for a defined client order.'
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                client_order:
                  type: string
                  format: uuid
                exchange_reject_reason:
                  type: string
                  x-nullable: true
                exchange_fee_currency:
                  type: string
                exchange_account:
                  type: string
                  format: uuid
                currency_pair:
                  type: string
                use_post_only:
                  type: boolean
                  x-nullable: true
                exchange_engine_order_id:
                  type: string
                strategy:
                  type: string
                uid:
                  type: string
                  format: uuid
                exchange_order_id:
                  type: string
                exchange_status:
                  type: string
                exchange_filled_qty:
                  type: string
                exchange_filled_fee:
                  type: string
                exchange_remaining_qty:
                  type: string
                exchange_executed_cost:
                  type: string
                exchange_executed_avg_price:
                  type: string
                exchange_timestamp:
                  type: string
                  format: date-time
                exchange_error:
                  type: string
                exchange_error_ack:
                  type: string
                  x-nullable: true
                limit_price:
                  type: string
                net_price:
                  type: string
                  x-nullable: true
                quantity:
                  type: string
                order_type:
                  type: string
                side:
                  type: string
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                finished_at:
                  type: string
                  format: date-time
                target_price_generated_ts:
                  type: string
                  format: date-time
                  x-nullable: true
                target_price:
                  type: string
                  x-nullable: true
                bookstats_target:
                  type: string
                bookstats_bid:
                  type: string
                bookstats_ask:
                  type: string
                bookstats_updated_at:
                  type: string
                  format: date-time
                exchange_bid:
                  type: string
                exchange_ask:
                  type: string
                exchange_updated_at:
                  type: string
                  format: date-time
                oc_bps:
                  type: string
                  x-nullable: true
                oc_factor:
                  type: string
                  x-nullable: true
                oc_aggression_scaler:
                  type: string
                  x-nullable: true
                oc_taker_maker_diff_bps:
                  type: string
                  x-nullable: true
                oc_take_price:
                  type: string
                  x-nullable: true
                is_taker:
                  type: boolean
                  x-nullable: true
                maker_quantity:
                  type: string
                taker_quantity:
                  type: string
                oc_10s_bid:
                  type: string
                  x-nullable: true
                oc_30s_bid:
                  type: string
                  x-nullable: true
                oc_10s_ask:
                  type: string
                  x-nullable: true
                oc_30s_ask:
                  type: string
                  x-nullable: true
                order_generated_ts:
                  type: string
                  format: date-time
                  x-nullable: true
                confirmed_at:
                  type: string
                  format: date-time
                  x-nullable: true
                net_consideration:
                  type: string
                gross_consideration:
                  type: string
                net_executed_quantity:
                  type: string
                sequence:
                  type: integer
                execution_ids:
                  type: array
                  items:
                    type: string
                funding_currency_cross_rate:
                  type: string
                account_fee_tier:
                  type: string
                exchange:
                  type: string
                organization:
                  type: integer
                margin_position:
                  type: string
                  x-nullable: true
                reconciled_by:
                  type: integer
                  x-nullable: true
      tags:
        - api
    parameters:
      - name: client_order_id
        in: path
        required: true
        type: string
        format: uuid
  /api/client_tags/:
    get:
      operationId: api_client_tags_list
      description: Pull a list of all active client tags.
      parameters:
        - name: limit
          in: query
          description: Number of results to return per page.
          required: false
          type: integer
        - name: offset
          in: query
          description: The initial index from which to return the results.
          required: false
          type: integer
      responses:
        '200':
          description: ''
          schema:
            type: object
            required:
              - count
              - results
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  type: object
                  properties:
                    slug:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
      tags:
        - api
    post:
      operationId: api_client_tags_create
      description: Create a new client tag.
      parameters:
        - name: data
          in: body
          required: true
          schema:
            type: object
            required:
              - name
            properties:
              slug:
                type: string
                description: Optional unique slug for the client tag. If not provided, it may be auto-generated.
              name:
                type: string
                description: Human-readable name for the client tag.
              description:
                type: string
                description: Optional description of the client tag.
      responses:
        '201':
          description: ''
          schema:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              description:
                type: string
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
      tags:
        - api
  /api/client_tags/deleted/:
    get:
      operationId: api_client_tags_deleted_tags
      description: Pull a list of all inactive client tags.
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
      tags:
        - api
  /api/client_tags/{slug}/:
    get:
      operationId: api_client_tags_read
      description: Pull an individual active client tags
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/ClientTag'
      tags:
      - api
    parameters:
    - name: slug
      in: path
      required: true
      type: string
  /api/cost_calculator/{symbol}:
    get:
      operationId: api_cost_calculator_read
      description: Gives you real time buy/sell liquidity for a given currency pair across selected venue(s) for a specified quantity.
      parameters:
        - name: side
          in: query
          description: Order direction, must be one of buy, sell, or both.
          required: true
          type: string
        - name: target_quantity
          in: query
          description: Specifies the target quantity to trade. One of target_quantity, funding_quantity, or inverse_target_quantity is required.
          required: false
          type: number
          format: float
        - name: funding_quantity
          in: query
          description: Specifies the funding quantity instead of target quantity. One of target_quantity, funding_quantity, or inverse_target_quantity is required.
          required: false
          type: number
          format: float
        - name: inverse_target_quantity
          in: query
          description: Specifies an inverse target quantity. One of target_quantity, funding_quantity, or inverse_target_quantity is required.
          required: false
          type: number
          format: float
        - name: markets
          in: query
          description: A semicolon-separated list of markets to consider. Each market can optionally specify a limit using a suffix.
          required: false
          type: string
        - name: client
          in: query
          description: The client identifier used to fetch a specific book instrument.
          required: false
          type: string
        - name: fees-{market}
          in: query
          description: Specifies a fee percentage for a specific market.
          required: false
          type: number
          format: float
        - name: fees-{client_id}-{market}
          in: query
          description: Specifies a client-specific fee for a market. Only applicable if a client_id is determined from markets or explicitly passed via client.
          required: false
          type: number
          format: float
        - name: depth_limit
          in: query
          description: Maximum depth of the order book to consider.
          required: false
          type: integer
        - name: price_limit
          in: query
          description: Sets an absolute price limit.
          required: false
          type: number
          format: float
        - name: price_limit_percent
          in: query
          description: Sets a percentage-based price limit. Cannot be used with price_limit.
          required: false
          type: number
          format: float
        - name: omit_matches
          in: query
          description: Whether to omit matching orders. Must be true or false.
          required: false
          type: boolean
        - name: quantity_precision
          in: query
          description: Specifies precision for quantity calculations. Use "auto" to fetch maximum precision. Accepts a string or integer value.
          required: false
          type: string
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              type: object
              properties:
                side:
                  type: string
                markets:
                  type: string
                target_quantity:
                  type: string
                funding_quantity:
                  type: string
                  x-nullable: true
                inverse_target_quantity:
                  type: string
                  x-nullable: true
                sweep_orders:
                  type: object
                  additionalProperties: true
                totals:
                  type: object
                  properties:
                    market:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          gross_consideration:
                            type: string
                          net_consideration:
                            type: string
                          fees:
                            type: string
                          quantity:
                            type: string
                          pricelevel_count:
                            type: integer
                          first_price:
                            type: string
                            x-nullable: true
                          last_price:
                            type: string
                            x-nullable: true
                    all:
                      type: object
                      properties:
                        gross_consideration:
                          type: string
                        net_consideration:
                          type: string
                        fees:
                          type: string
                        quantity:
                          type: string
                        pricelevel_count:
                          type: integer
                        first_price:
                          type: string
                          x-nullable: true
                        last_price:
                          type: string
                          x-nullable: true
                matches:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                last_rx_nanos:
                  type: integer
                  format: int64
                last_rx_nanos_market:
                  type: string
                internal_latency_nanos:
                  type: integer
                  format: int64
                last_source_nanos:
                  type: integer
                  format: int64
                last_source_nanos_market:
                  type: string
                fast:
                  type: string
      tags:
        - api
    parameters:
      - name: symbol
        in: path
        description: The trading pair symbol (e.g., BTC-USDT).
        required: true
        type: string
  /api/currencies/:
    get:
      operationId: api_currencies_list
      description: Lists All Currencies.
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              slug:
                type: string
              cbbo_sizes:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    size:
                      type: string
                    usd_value:
                      type: number
                      x-nullable: true
                    currency:
                      type: integer
              is_fiat:
                type: boolean
      tags:
        - api
    parameters: []
  /api/currencies/{slug}/:
    get:
      operationId: api_currencies_read
      description: Get a specific Currency.
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              slug:
                type: string
              cbbo_sizes:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    size:
                      type: string
                    usd_value:
                      type: number
                      x-nullable: true
                    currency:
                      type: integer
              is_fiat:
                type: boolean
      tags:
      - api
    parameters:
    - name: slug
      in: path
      description: Short code for this currency
      required: true
      type: string
  /api/currency_balances/:
    get:
      operationId: api_currency_balances_list
      description: List all Exchange Currency Balances.
      parameters:
        - name: strategy
          in: query
          description: Filter balances by strategy.
          required: false
          type: string
