    get:
      operationId: otc_api_order_read
      description: 'These methods allow viewing, creating and cancelling OTC orders.
        NOTE: If the user has multiple customers, pass the customer name in the querystring
        as ?customer=CUSTOMERNAME (make sure to url-encode the customer name)'
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/StaffExternalClientOrder'
      tags:
      - otc
    parameters:
    - name: order_id
      in: path
      required: true
      type: string
  /otc/api/order/{order_id}/cancel/:
    post:
      operationId: otc_api_order_cancel
      description: Cancels the given order. Parameters other than order ID will be
        ignored. Note that any SOR orders currently being routed may still end up
        executing.
      parameters: []
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/StaffExternalClientOrder'
      tags:
      - otc
    parameters:
    - name: order_id
      in: path
      required: true
      type: string
  /otc/api/order/{order_id}/modify/:
    post:
      operationId: otc_api_order_modify
      description: >
        Modifies the given External Client order. Only modifiable parameters
        are taken into account i.e quantity, limit_price.

        Modification is done on a best effort basis.
      parameters:
        - name: data
          in: body
          required: true
          schema:
            type: object
            properties:
              quantity:
                type: string
                description: Updated order quantity.
              limit_price:
                type: string
                description: Updated limit price for the order.
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/StaffExternalClientOrder'
      tags:
        - otc
    parameters:
      - name: order_id
        in: path
        required: true
        type: string
  /otc/api/settlement/:
    get:
      operationId: otc_api_settlement_list
      description: ''
      parameters:
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        type: integer
      responses:
        '200':
          description: ''
          schema:
            required:
            - count
            - results
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  $ref: '#/definitions/CustomerSettlement'
      tags:
      - otc
    post:
      operationId: otc_api_settlement_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/CustomerSettlement'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/CustomerSettlement'
      tags:
      - otc
    parameters: []
  /otc/api/settlement/export_csv/:
    get:
      operationId: otc_api_settlement_export_csv
      description: ''
      parameters:
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        type: integer
      responses:
        '200':
          description: ''
          schema:
            required:
            - count
            - results
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  $ref: '#/definitions/CustomerSettlement'
      tags:
      - otc
    parameters: []
  /otc/api/settlement/{id}/:
    get:
      operationId: otc_api_settlement_read
      description: ''
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/CustomerSettlement'
      tags:
      - otc
    parameters:
    - name: id
      in: path
      required: true
      type: string
definitions:
  AccountFundingEvent:
    required:
    - amount
    - transaction_id
    - event_type
    type: object
    properties:
      account:
        title: Account
        type: string
        readOnly: true
      account_id:
        title: Account id
        type: string
        readOnly: true
      exchange:
        title: Exchange
        type: string
        readOnly: true
      currency:
        title: Currency
        type: string
        readOnly: true
      amount:
        title: Amount
        type: string
        format: decimal
      transaction_id:
        title: Transaction id
        type: string
        maxLength: 255
        minLength: 1
      blockchain_id:
        title: Blockchain id
        type: string
        maxLength: 255
        x-nullable: true
      exchange_timestamp:
        title: Exchange timestamp
        type: string
        format: date-time
        x-nullable: true
      updated_at:
        title: Updated at
        type: string
        format: date-time
        readOnly: true
      event_type:
        title: Event type
        type: string
        enum:
        - deposit
        - withdrawal
  ClientOrder:
    required:
    - order_type
    - currency_pair
    - quantity
    - side
    - strategy
    type: object
    description: |
      ## Required fields by order type

      Every client order requires `order_type`, `currency_pair`, `quantity`, `side`, and `strategy`.
      The following additional requirements depend on the selected algorithm.

      | Order type | Required fields and conditions |
      | --- | --- |
      | **smart post** | No additional fields are required for single-product orders. For multi-product orders, `target_currency` and `target_currency_pairs` must be supplied together. |
      | **sweep** | No additional fields are required. `limit_price` and `exchanges` are optional in the REST API. Set a limit explicitly unless unbounded/default pricing is intentional. |
      | **twap** | At least one of `end_time` or `end_offset` is required. If both are omitted, the API currently accepts the request but creates a Smart Post order. `interval_sec` is optional; the deprecated `interval_length` default is 5 minutes. |
      | **scheduled post** | At least one of `end_time` or `end_offset` is required. If both are omitted, the API currently accepts the request but creates a Smart Post order. `interval_sec` is optional; the deprecated `interval_length` default is 5 minutes. |
      | **time pace** | `interval_sec` and `interval_qty` are required. `interval_length` is not an accepted substitute for `interval_sec`. |
      | **smart stop** | `stop_price` is required and controls when the order becomes active. |
      | **pov** | `volume_constraint_pct` and `volume_constraint_interval_secs` are required. |
      | **spread** | `contra_product` is required. When `market_spread` is false, either `spread_offset_pct` or `spread_offset_value` is also required. No spread offset is required when `market_spread` is true. Product and risk quantities remain subject to venue/product minimums. |
      | **pairs** | `contra_product` and `lead_mode` are required. When `market_spread` is false, `pairs_ratio` is also required; it is optional when `market_spread` is true. `quantity_currency` is optional and defaults to the target currency. |
      | **dma** | `exchanges` is required and must contain exactly one exchange. `limit_price` and `sub_order_type` are optional in the REST API. `sub_order_type` defaults to `post`. |

      `client_order_id` is optional, but clients should provide a unique URL-safe value for reliable lifecycle tracking.

    properties:
      order_type:
        title: Order type
        type: string
        enum:
        - smart post
        - sweep
        - smart stop
        - spread
        - pairs
        - cade other
        - pov
        - dma
        - twap
        - scheduled post
        - time pace
      order_status:
        title: Order status
        description: Order status **can only be sent as 'open' to send an order directly
          into the market or 'staged'** to require manual approval from a trader.  The
          other status may be returned on GET, but cannot be set by the user directly.
        type: string
        enum:
        - open
        - staged
        - open(pending)
        - open(crashed)
        - cancelled(pending)
        - cancelled
        - rejected
        - error
        - closed
        default: open
      aggression:
        title: Aggression
        description: "\n **MAKER ONLY**\n - **Passive**: Sets the target price at\
          \ 25% of the spread towards the more aggressive price of the weighted CONSOLIDATED\
          \ order book.\n- **Neutral**: Sets the target price at the midpoint (50%)\
          \ of the weighted CONSOLIDATED order book.\nNote: Orders can be Taker if\
          \ \u201CSweep to\u201D is set to Target or Cheaper. In constrained algos\
          \ (TWAP, Scheduled Post, POV, and TimePace), Passive and Neutral can still\
          \ send IOC orders at the end of the interval.\n\n**MAKER AND TAKER**\n-\
          \ **Aggressive**: Sets the target price 75% of the spread towards the more\
          \ aggressive price of the weighted CONSOLIDATED order book.\n- **Near Peg**:\
          \ Pegs to the top of book(best bid for a buy / best offer for a sell) on\
          \ a specific exchange. If you select 5 different exchanges in the \u201C\
          exchange\u201D field, orders have 5 different prices.\n- **Midpoint Peg**:\
          \ Pegs to the midpoint on a specific exchange. If you select 5 different\
          \ exchanges in the \u201Cexchange\u201D field, orders can have 5 different\
          \ prices.\n- **Far Peg**: Pegs to one increment below the best ask for a\
          \ buy, creating a new best bid. Pegs to one increment above the best bid\
          \ for sell, creating a new best ask. If you select 5 different exchanges\
          \ in the \u201Cexchange\u201D field, orders can have 5 different prices.\n\
          - **Auto**: **TWAP, Scheduled Post, Time Pace & POV.** Adjusts the aggression level of the order over the course of\
          \ the interval. The order starts out as Neutral for each interval.Halfway\
          \ through the interval time, if less than 60% of the interval quantity is\
          \ executed, the aggression level switches to Aggressive. At 90% of the interval,\
          \ if less than 90% has filled, the aggression changes to Market Peg.\n"
        type: string
        enum:
        - passive
        - neutral
        - aggressive
        - auto
        - near_peg
        - midpoint_peg
        - far_peg
      move_percentage:
        title: Move percentage
        description: '**Smart Post, TWAP, Scheduled Post, Time Pace & Smart Stop.** Percentage threshold that determines when new orders will be sent if existing ones remain unfilled.'
        type: string
        format: decimal
        x-nullable: true
      percent_limit_price:
        title: Percent limit price
        description: '**Sweep.** Percentage offset used to calculate the limit price for. The limit price will be derived from the current market price adjusted by the specified percentage.'
        type: string
        format: decimal
        x-nullable: true
      max_post_size:
        title: Max post size
        description: Maximum order size to be posted for a single order on an exchange.
        type: string
        format: decimal
        x-nullable: true
      end_time:
        title: End time
        description: '**TWAP & Scheduled Post.** Absolute end time of the order. At least one of `end_time` or `end_offset` is required to create the requested time-based algorithm. If both are omitted, the API currently creates a Smart Post order instead.'
        type: string
        format: date-time
        x-nullable: true
      interval_length:
        title: Interval length
        description: 'Deprecated: use `interval_sec`. **TWAP & Scheduled Post only.** Controls the interval length in minutes and defaults to 5 when neither interval field is supplied. It is not an accepted substitute for `interval_sec` on Time Pace orders.'
        type: integer
        default: 5
        minimum: 0
        x-nullable: true
      tolerance_pct:
        title: Tolerance pct
        description: '**TWAP, Scheduled Post & Time Pace.** Defines the percentage threshold that determines how far ahead or behind schedule the algorithm is allowed to operate.'
        type: integer
        default: 20
        maximum: 100
        minimum: 10
        x-nullable: true
      sweep_pct:
        title: Sweep pct
        description: '**Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop & POV.** Maximum percentage a single sweep is allowed to move past the CBBO (Consolidated Best Bid and Offer) when pursuing a goal.'
        type: string
        format: decimal
        x-nullable: true
      currency_pair:
        title: Currency pair
        description: Currency Pair
        type: string
        example: ETH-BTC
      quantity:
        title: Quantity
        type: string
        format: decimal
        example: '1'
      limit_price:
        title: Limit price
        description: The limit price for the order, specified in the funding currency. The REST API accepts this field as optional, including for Sweep and DMA. Set it explicitly unless unbounded or algorithm-default pricing is intentional.
        type: string
        format: decimal
        x-nullable: true
        example: '200'
      side:
        title: Side
        type: string
        enum:
        - buy
        - sell
      exchanges:
        description: 'A list of target exchanges for the order. For DMA this field is required and must contain exactly one exchange. For other order types it defaults to all exchanges defined by the strategy. Example: ["binance","gdax"].'
        type: array
        items:
          description: Name of Exchange
          type: string
          format: slug
          pattern: ^[-a-zA-Z0-9_]+$
          example: binance
        uniqueItems: true
      market_data_exchanges:
        description: '**Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop & POV.** A list of exchanges to source market data from. Defaults to all exchanges defined by the strategy (as specified in the strategy parameter). EX: ["binance","gdax"]'
        type: array
        items:
          description: Name of Exchange
          type: string
          format: slug
          pattern: ^[-a-zA-Z0-9_]+$
          example: binance
        uniqueItems: true
      client_order_id:
        title: Client order id
        description: Optional UUID to use for client order ID.  Automatically generated if omitted.
        type: string
        format: slug
        pattern: ^[-a-zA-Z0-9_]+$
        default: 8a9c9c7d-8d26-4ccd-8bdd-389f9bd62940
        minLength: 1
      strategy:
        title: Strategy
        description: Identifier of the trading strategy, as defined in the Admin menu.
        type: string
        example: default
        default: default
      post_exchange_count:
        title: Post exchange count
        description: '**Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop, POV, Spread & Pairs.** Specifies the number of exchanges to post on during a single round of routing. Default is 2.'
        type: integer
        default: 0
        minimum: 0
      max_order_count:
        title: Max order count
        description: '**Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop, POV, Spread & Pairs.** Specifies how many resting orders from previous price updates should remain on the exchange order books. Default is 4.'
        type: integer
        default: 0
        minimum: 0
        x-nullable: true
      use_funding_currency:
        title: Use funding currency
        description: '**Smart Post, Sweep, TWAP, Scheduled Post, Time Pace, Smart Stop, POV & Pairs.** Specifies the currency unit used for the order quantity.'
        type: boolean
        default: false
        x-nullable: true
      stop_price:
        title: Stop price
        description: '**Required for Smart Stop.** The stop price that triggers the stop order. A buy order triggers when the market price rises above this value; a sell order triggers when the market price falls below it.'
        type: string
        format: decimal
        x-nullable: true
      end_offset:
        title: End offset
        description: '**TWAP & Scheduled Post.** Duration of the order in seconds. At least one of `end_offset` or `end_time` is required to create the requested time-based algorithm. If both are omitted, the API currently creates a Smart Post order instead.'
        type: string
        x-nullable: true
      quantity_currency:
        title: Quantity currency
        description: '**Smart Post, Sweep, TWAP, Scheduled Post, Time Pace, Smart Stop, POV & Pairs.** Specifies the currency unit used for the order quantity. Defaults to the target currency. Will automatically populate use_funding_currency.'
        type: string
        minLength: 1
        x-nullable: true
      sweep_to:
        title: Sweep to
        description: |
          **Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop & POV.**

          - **Disabled**: For passive and neutral aggression levels, the algo will never send IOC (taker) orders. Instead, it will only send POST (maker) orders. Other aggression levels behave normally.
          - **Cheaper**: Routes orders to a liquidity provider if their price (net of fees) is cheaper than the price available on exchange.
          - **Target**: Sends an IOC (taker) order to an exchange or liquidity provider when a price (net of fees) is available that is better than the internally calculated target price.
        type: string
        enum:
          - disabled
          - cheaper
          - target
        x-nullable: true
      notes:
        title: Notes
        type: string
        x-nullable: true
      volume_constraint_pct:
        title: Volume constraint pct
        description: '**Smart Post, TWAP, Scheduled Post & POV.** Restricts order size to the specified percentage of trading volume in each interval. Required for POV orders.'
        type: string
        format: decimal
        x-nullable: true
      volume_constraint_interval_secs:
        title: Volume constraint interval secs
        description: '**Smart Post, TWAP, Scheduled Post & POV.** Length of each volume-constraint interval in seconds. Must be a multiple of 60 and is required for POV orders.'
        type: integer
        minimum: 0
        x-nullable: true
      volume_constraint_max_post_size:
        title: Volume constraint max post size
        description: '**POV.** If set to true, the maximum posted order size will be limited to the average trade size aggregated across the configured exchanges.'
        type: boolean
        default: false
      position_id:
        title: Position id
        description: Position ID for this order
        type: string
        maxLength: 100
        x-nullable: true
      min_post_size:
        title: Min post size
        description: 'Minimum order size to be posted for a single order on an exchange.'
        type: string
        format: decimal
        x-nullable: true
      post_only:
        title: Post only
        description: Indicates whether child orders should be posted as post_only.
        type: boolean
        default: false
        x-nullable: true
      contra_product:
        title: Contra product
        description: '**Required for Spread & Pairs.** Specifies the currency pair used for the contra leg.'
        type: string
        x-nullable: true
        example: ETH-BTC
      contra_exchanges:
        description: '**Spread & Pairs.** A list of target exchanges for the contra leg of the order. Defaults to all exchanges defined by the strategy (as specified in the strategy parameter). EX: ["binance","gdax"]'
        type: array
        items:
          description: Name of Exchange
          type: string
          format: slug
          pattern: ^[-a-zA-Z0-9_]+$
          example: binance
        uniqueItems: true
      market_spread:
        title: Market spread
        description: '**Spread & Pairs.** Enables dollar-neutral execution between two products and defaults to `false`. When false, Spread requires either `spread_offset_pct` or `spread_offset_value`, and Pairs requires `pairs_ratio`. Those target fields are optional when `market_spread` is true.'
        type: boolean
        default: false
        x-nullable: true
      spread_offset_pct:
        title: Spread offset pct
        description: '**Spread.** Target spread threshold as a percentage. When `market_spread` is false, provide either this field or `spread_offset_value`.'
        type: string
        format: decimal
        x-nullable: true
        example: '0.01'
      spread_offset_value:
        title: Spread offset value
        description: '**Spread.** Target spread threshold as a notional value. When `market_spread` is false, provide either this field or `spread_offset_pct`.'
        type: string
        format: decimal
        x-nullable: true
        example: '0.01'
      reprice_increment_pct:
        title: Reprice increment pct
        description: '**Spread & Pairs.** Specifies the percentage change at which the algorithm should reprice.'
        type: string
        format: decimal
        x-nullable: true
        example: '0.01'
      risk_quantity:
        title: Risk quantity
        description: '**Spread & Pairs.** Optional maximum portion of the order quantity that may be out of balance. Defaults to 10% of the order quantity. When supplied or defaulted, the effective value remains subject to product and venue minimum-order-size validation.'
        type: string
        format: decimal
        x-nullable: true
        example: '1'
      risk_quantity_notional_usd:
        title: Risk quantity notional usd
        description: '**Spread & Pairs.** Defines the maximum portion of the order quantity that may be out of balance, expressed in notional USD.'
        type: string
        format: decimal
        x-nullable: true
        example: '1'
      lead_mode:
        title: Lead mode
        description: '**Spread & Pairs.** Specifies which side posts first. Required for Pairs orders.'
        type: string
        enum:
        - anchor
        - contra
        - disabled
        x-nullable: true
      sweep_trigger_mode:
        title: Sweep trigger mode
        description: |
          **Spread & Pairs.**
          - **Immediate**: Once the first leg executes, an IOC order is sent for the second leg.
          - **Disabled**: Making orders are sent for both the first and second leg of the trade.
          - **Threshold**: If the observed spread offset % is between 0 and the Sweep Trigger Threshold % entered, the algo will send an IOC order on the second leg.
        type: string
        enum:
        - disabled
        - immediate
        - threshold
        x-nullable: true
      sweep_trigger_threshold_pct:
        title: Sweep trigger threshold pct
        description: '**Spread.** Optional spread percentage below which the system reverts to sweep behaviour when `sweep_trigger_mode` is `threshold`. The REST API accepts threshold mode without this field.'
        type: string
        format: decimal
        x-nullable: true
        example: '0.01'
      balancing_max_post_size:
        title: Balancing max post size
        description: '**Spread & Pairs.** Maximum order size to be posted for a single order on an exchange on the contra leg.'
        type: string
        format: decimal
        x-nullable: true
      exchange_distribution:
        title: Exchange distribution
        description: |
          Defines how order quantity should be distributed across exchanges.

          The **unit** field determines how the distribution values are interpreted.
          Currently supported:
          - **percentage** - values represent percentage allocation per exchange.
          - **absolute** - values represent the absolute quantity allocated to each exchange.

          The **distribution** object maps exchange identifiers to their allocation value.
        type: object
        x-nullable: true
        properties:
          unit:
            type: string
            description: Unit used to interpret the distribution values.
            example: percentage
          distribution:
            type: object
            description: Mapping of exchange identifiers to their allocation values.
            additionalProperties:
              type: string
            example:
              binance: "70"
              okex: "30"
        example:
          unit: percentage
          distribution:
            binance: "70"
            okex: "30"
      target_currency:
        title: Target currency
        description: "**Smart Post.** Enables multi-product trading and specifies the target currency for the order. The target_currency_pairs parameter is required when using this field."
        type: string
        minLength: 1
      target_currency_pairs:
        description: "**Smart Post.** List of currency pair strings used for multi-product orders. The first pair must match the currency_pair parameter. The target_currency parameter is required when using this field."
        type: array
        items:
          description: Name of Currency Pair
          type: string
          example: BTC-USD
        uniqueItems: true
      sub_order_type:
        title: Sub order type
        description: '**DMA.** Optional child-order instruction. Supported values are `ioc`, `post`, and `post_only`; defaults to `post` when omitted.'
        type: string
        enum:
        - ioc
        - post
        - post_only
        x-nullable: true
      pause_offset_pct:
        title: Pause offset pct
        description: '**Spread.** Pauses order posting when the spread between the anchor and contra sides exceeds the specified threshold.'
        type: string
        format: decimal
        x-nullable: true
      reduce_only:
        title: Reduce only
        description: '**Smart Post, Sweep, TWAP, Scheduled Post, Time Pace, Smart Stop & POV.** Sends orders with the reduce_only flag, ensuring they can only decrease an existing position.'
        type: boolean
        default: false
        x-nullable: true
      spread_offset_mode:
        title: Spread offset mode
        description: '**Spread.** Specifies how the spread offset is calculated. direct uses the spread offset percentage directly, while cross_rate uses the cross rate to calculate the spread offset percentage.'
        type: string
        enum:
        - direct
        - cross_rate
        x-nullable: true
      quantity_fee_mode:
        title: Quantity fee mode
        description: |
          Determines whether exchange fees are included when calculating the order notional.

          - **Net**: Exchange fees are excluded from the notional value. A $100,000 order will execute $100,000 of notional value, and the total filled amount may exceed $100,000 once fees are applied.
          - **Gross**: Exchange fees are included in the notional value. A $100,000 order will ensure the total value, including fees, does not exceed $100,000.
        type: string
        enum:
          - gross
          - net
        x-nullable: true
      interval_sec:
        title: Interval sec
        description: '**TWAP, Scheduled Post & Time Pace.** Controls interval length in seconds. Required for Time Pace. Optional for TWAP and Scheduled Post, which default to the deprecated five-minute `interval_length` when neither interval field is supplied.'
        type: string
        format: decimal
        x-nullable: true
      pairs_ratio:
        title: Pairs ratio
        description: '**Pairs.** Target ratio calculated as anchor product price divided by contra product price. Required when `market_spread` is false and optional when `market_spread` is true.'
        type: string
        format: decimal
        x-nullable: true
        example: '50.00'
      pause_offset_ratio:
        title: Pause offset ratio
        description: '**Pairs.** Defines the ratio at which the algorithm may begin posting orders for the lead leg when the target ratio is not marketable.'
        type: string
        format: decimal
        x-nullable: true
      bps_offset:
        title: Bps offset
        description: 'Adjusts the limit price of child orders by the specified number of basis points (bps).'
        type: string
        format: decimal
        x-nullable: true
      interval_qty:
        title: Interval qty
        description: '**Required for Time Pace.** Specifies the amount of the target currency to be filled in each interval.'
        type: string
        format: decimal
        example: '1'
      staged_order_data:
        title: Staged order data
        type: object
      balancing_bps_offset:
        title: Balancing bps offset
        description: '**Spread & Pairs.** Adjusts the limit price of child orders on the contra leg by the specified number of basis points (bps).'
        type: string
        format: decimal
        x-nullable: true
      latest_interval_weight_pct:
        title: Latest interval weight pct
        description: Weight applied to the most recent interval when calculating volume constraints for volume-constrained algorithms.
        type: string
        format: decimal
        x-nullable: true
      full_size:
        title: Full size
        description: "**Smart Post, Sweep & Smart Stop.** Determines whether the full order size is submitted on the initial SOR order."
        type: boolean
        default: false
        x-nullable: true
      cancel_time:
        title: Cancel time
        description: "**Smart Post, Time Pace, Smart Stop, POV, Spread & Pairs.** Cancels the order at the specified time if it remains open."
        type: string
        format: date-time
        x-nullable: true
      gtt_duration:
        title: Gtt duration
        description: "**Smart Post, Sweep, TWAP, Scheduled Post, Time Pace, Smart Stop, POV, Spread & Pairs.** The number of seconds for which the order remains valid before expiring. If both gtt_duration and gtt_expiration are provided, the order expires when the earlier of the two conditions is reached."
        type: integer
        minimum: 0
        x-nullable: true
      gtt_expiration:
        title: Gtt expiration
        description: "**Smart Post, Sweep, TWAP, Scheduled Post, Time Pace, Smart Stop, POV, Spread & Pairs.** The timestamp at which the order will expire. If both gtt_expiration and gtt_duration are provided, the order expires when the earlier of the two conditions is reached."
        type: string
        format: date-time
        x-nullable: true
      pause_offset_value:
        title: Pause offset value
        description: '**Smart Post.** Defines the threshold from the limit price at which the algorithm will begin posting or withdrawing orders when the market mid reaches this value.'
        type: string
        format: decimal
        x-nullable: true
      pause_offset_unit_qty:
        title: Pause offset unit qty
        description: '**Smart Post.** Unit quantity used to determine the pause offset for Smart Post orders.'
        type: string
        enum:
        - bps
        - percentage
        - value
        x-nullable: true
      aggression_allocation_pcts:
        title: Aggression allocation percentages
        description: Defines how the algorithm distributes an interval's order quantity across different aggression levels.
        type: object
        x-nullable: true
        additionalProperties:
          type: string
        example:
          passive: "50"
          neutral: "25"
          aggressive: "25"
      balancing_post_only:
        title: Balancing post only
        description: '**Spread.** Indicates whether child orders on the contra leg should be posted as post_only. Not supported when sweep_trigger_mode is set to immediate.'
        type: boolean
        x-nullable: true
      balancing_aggression:
        title: Balancing aggression
        description: Specifies the contra leg's aggression.
        type: string
        enum:
        - passive
        - neutral
        - aggressive
        - market peg
        - auto
        - near_peg
        - midpoint_peg
        - far_peg
        x-nullable: true
      disable_ioc_catchup:
        title: Disable ioc catchup
        description: "**TWAP, Scheduled Post & POV.** Disables IOC catch-up on previous intervals. Only the current interval's quantity can be sent as IOC; any catch-up is instead allocated to posting logic. **Note: current interval IOC catchup will still occur.**"
        type: boolean
        default: false
        x-nullable: true
      lead_reduce_only:
        title: Lead reduce only
        description: '**Spread.** Sends orders with the reduce_only flag on the anchor leg, ensuring they can only decrease an existing position.'
        type: boolean
        default: false
        x-nullable: true
      price_range:
        title: Price range
        description: '**Smart Post.** Specifies the price range for the order, formatted as [lower_price]_[upper_price].'
        type: string
        maxLength: 100
        minLength: 1
        x-nullable: true
        example: "60000_70000"
      price_range_unit:
        title: Price range unit
        description: '**Smart Post.** Specifies the unit used for the price range. **price** applies absolute prices, while **bps** applies basis points relative to the mid price at the start of the order.'
        type: string
        enum:
        - price
        - bps
        x-nullable: true
      progression_increment:
        title: Progression increment
        description: "**Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop, POV & Spread.** Instructs the algorithm to increase aggressiveness incrementally on SOR order cancels and reprices, advancing one progression_increment at a time until a fill occurs (at which point it resets to 0) or the maximum of 200 progression_increments is reached. Can't be used when aggression is auto."
        type: integer
        minimum: 0
        x-nullable: true
      progression_mode:
        title: Progression mode
        description: |
          **Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop, POV & Spread.**
          Specifies how **progression_increment** is applied as aggressiveness increases.

          - **linear**: Increases linearly (1, 2, 3, 4)
          - **exponential**: Increases exponentially (1, 2, 4, 8)
        type: string
        enum:
          - linear
          - exponential
        x-nullable: true
      bookstats_quantity_target:
        title: Bookstats quantity target
        description: |
          **Smart Post, TWAP, Scheduled Post, Time Pace, Smart Stop, POV, Range & Bracket.**
          Determines how the algorithm sizes child orders relative to visible liquidity.

          - **average**: Uses the average quantity across the target exchange's top n levels.
          - **large**: Uses the average quantity of the largest m quantities within the target exchange's top n levels.
          - **average_all**: Uses the average quantity across the aggregated book's top n levels.
          - **large_all**: Uses the average quantity of the largest m quantities within the aggregated book's top n levels.

          The values n and m are dynamically determined by the algorithm.
        type: string
        enum:
          - average
          - large
          - average_all
          - large_all
        default: large
        x-nullable: true
