  /otc/api/order/:
    get:
      operationId: otc_api_order_list
      description: >
        These methods allow viewing, creating and cancelling OTC orders.
        NOTE: If the user has multiple customers, pass the customer name in the
        querystring as ?customer=CUSTOMERNAME (make sure to url-encode the customer name)
      parameters:
        - name: created_at_after
          in: query
          description: Filter orders created after this timestamp.
          required: false
          type: string
          format: date-time
        - name: created_at_before
          in: query
          description: Filter orders created before this timestamp.
          required: false
          type: string
          format: date-time
        - name: customer
          in: query
          description: Filter orders by customer name.
          required: false
          type: string
        - name: client_order_id
          in: query
          description: Filter by client order ID.
          required: false
          type: string
        - name: order_type
          in: query
          description: Filter by order type.
          required: false
          type: string
          enum:
            - IOC
            - PEG
            - TWAP
        - name: side
          in: query
          description: Filter by order side.
          required: false
          type: string
          enum:
            - buy
            - sell
        - name: currency_pair
          in: query
          description: Filter by currency pair.
          required: false
          type: string
        - name: limit
          in: query
          description: Number of results to return per page.
          required: false
          type: integer
        - name: offset
          in: query
          description: The initial index from which to return the results.
          required: false
          type: integer
      responses:
        '200':
          description: ''
          schema:
            type: object
            required:
              - count
              - results
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  $ref: '#/definitions/StaffExternalClientOrder'
      tags:
        - otc
    post:
      operationId: otc_api_order_create
      description: >
        These methods allow viewing, creating and cancelling OTC orders.
        NOTE: If the user has multiple customers, pass the customer name in the
        querystring as ?customer=CUSTOMERNAME (make sure to url-encode the customer name)
      parameters:
        - name: data
          in: body
          required: true
          schema:
            type: object
            required:
              - side
              - currency_pair
              - order_type
              - quantity
            properties:
              side:
                type: string
                description: Order side.
                enum:
                  - buy
                  - sell
              currency_pair:
                type: string
                description: Trading pair for the OTC order.
              order_type:
                type: string
                description: Type of OTC order.
                enum:
                  - IOC
                  - PEG
                  - TWAP
              quantity:
                type: string
                description: Order quantity.
              limit_price:
                type: string
                description: >
                  Limit price for the order.
                  Required when order_type is IOC.
              use_funding_currency:
                type: boolean
                description: Whether to use the funding currency for settlement.
              end_offset:
                type: string
                description: >
                  End offset for TWAP orders.
                  Required when order_type is TWAP.
                  Only applicable to TWAP orders.
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/StaffExternalClientOrder'
      tags:
        - otc
    parameters: []
