# Instrument universe for CME Group futures (ARCHITECTURE §3). Covers CME/CBOT/
# NYMEX/COMEX — all reachable via the same Databento GLBX.MDP3 dataset, so they
# share source "cme". Vendor/fetch specifics (parent symbols) live in
# config/data/cme.yaml, not here.
#
# `multiplier` is the point value: tick_value = tick_size * multiplier, in the
# instrument's *quoted* price unit. Most CME products quote in USD; grains and
# soybean oil quote in CENTS (noted inline), so their tick_size/multiplier are in
# cents to keep the identity above true.
#
# Session templates: research confirms equity-index, FX, rates, energy and metals
# all trade the same Globex schedule, so they share one template; CBOT grains run
# a distinct overnight+day session.

sessions:
  cme_globex: "Sun 17:00 -> Fri 16:00 America/Chicago, daily maintenance halt 16:00-17:00"
  cbot_grain: "Sun-Fri 19:00 -> 07:45 + Mon-Fri 08:30 -> 13:20 America/Chicago (overnight electronic + day session)"

# --- Equity index (cash-settled to the index) ---

es:
  asset_type: futures
  exchange: cme
  currency: USD
  tick_size: 0.25
  multiplier: 50            # $50 x index; tick_value = 0.25 * 50 = $12.50
  rolling_cycle: [H, M, U, Z]
  strips: 2                 # continuous strips to build (es1, es2)
  sector: equity
  subsector: us_large_cap
  session: cme_globex
  settlement: cash

nq:
  asset_type: futures
  exchange: cme
  currency: USD
  tick_size: 0.25
