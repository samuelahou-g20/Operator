# Per-desk token/strategy rosters + agg_bot sheet wiring. This is the ONLY place these live —
# a new owner running this for a different desk/token roster edits this file, not scripts/*_bot.py.
#
# `strategy` maps token -> exact CoinRoutes strategy NAME (spot gamma book). The create-order API
# matches by exact NAME (case-sensitive, NOT the slug) — see docs/bots.md's CoinRoutes gotchas.
# `perp_strategy` is the strategy used for tokens not in `strategy` (perps-only hedge book).
# `spot_strategy` is the catch-all SPOT book for a desk with no per-token roster (OTC).
# `agg` is scripts/agg_bot.py's Google Sheet wiring for that desk's Aggregator Dashboard tab.
# `bots` is the desk's Pluto BotManager roster read by scripts/botstatus_bot.py — exact `name`
# values as the API returns them, leading `*` (Firm-owned) included. Only listed bots are shown,
# and a listed bot the API does not return is reported as MISSING rather than dropped, so this is
# the roster of record: a bot removed here stops being monitored. Some names contain SPACES.
#
# Safety-relevant values (PLACE_STATUS, MAX_MULT, DEFAULT_MAX_POST_USD, DEFAULT_QTY, per-desk
# max_usd) stay hardcoded in scripts/trade_bot.py per the owner — do NOT move them here.

