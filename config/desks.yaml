  perp_strategy: mm3-futurestrading-ha-j
  strategy:
    DNX: MM-C115-DNX-GAMMA-J
    # CXT moved to the MM4 desk 2026-09-10 — removed from this roster.
    # ⚠️ RDS still tags all 16 of its active locations desk=MM3, so its flow keeps
    # appearing in MM3's flow alerts and `/trade today` until reference data is
    # corrected. Same lag as LAPTOP (tagged MM2) and DECIBEL (tagged MM5).
    TRUF: MM-C67_TRUF-GAMMA-J
    ELA: MM-C142_ELA-GAMMA-J
    NYM: MM-C246_NYM-GAMMA-J
    XCH: MM-C77_XCH-GAMMA-J
