otc:
  # OTC desk: ONE catch-all SPOT strategy for every token, no per-token gamma roster — the third
  # desk shape (gamma desks map token->strategy; treasury is one strategy but PERPS).
  # `spot_strategy` routes any token to `<TOKEN>-<quote>` spot on this book; there is no
  # `perp_strategy`, because the account is spot (`is_margin: false`), so `/trade … perp` is
  # refused. Runs on CR_API_TOKEN_MM3 — `bot_mm3user` is already in the strategy's `users` list.
  # ⚠️ This book executes on BINANCE and KUCOIN only (2 accounts) — far narrower than the
  # 11-venue OTC-GENERAL-J. A token that trades on neither has no book and is refused, not routed.
  spot_strategy: OTC-C04.2-HA-J
  strategy: {}

treasury:
  # Prop book: one CoinRoutes strategy for every token (no per-token gamma roster). Perps.
  # Its aggregator is NOT a Google Sheet — agg_bot reads the Pluto portfolio endpoint
  # (portfolio TREASURYPROPTOTAL), so there is no `agg` sheet block here.
  perp_strategy: g20ha-treasury-prop
  strategy: {}
  bots:
    - "*TREASURY_PROP_JASONDH"
    - "*TREASURY_PROP_HEDGER"
    - "*TREASURYPROP Complex futures"
    - "*TREASURYPROP NOTIFIER"
