    UFD: mm-c284_ufd-gamma-j
    PARTI: mm-c290_parti-gamma-j
    CROSS: MM-C319_CROSS-GAMMA-J
    DODO: mm-c339_dodo-gamma-j
    QI: MM-C136_QI-GAMMA-J
    NEO: MM-C237_NEO-GAMMA-J
    GAS: MM-C237_GAS-GAMMA-J
    RHEA: MM-C312_RHEA-GAMMA-J
    PUBLIC: MM-C330_PUBLIC-GAMMA-J
    HNT: MM-C363_HNT-GAMMA-J
    MAGMA: mm-c389_magma-gamma-j
    VTHO: MM-C209_VTHO-GAMMA-J
    # Renamed on CoinRoutes to lowercase between 2026-08-25 and 2026-08-28; the create-order API
    # matches by exact NAME, so the old MM-C145_MINA-GAMMA-J 400s with "does not exist".
    MINA: mm-c145_mina-gamma-j
    AZTEC: mm-c402_aztec-gamma-j
    BGB: MM-H004_BGB-GAMMA-J
    BTW: mm-h011_btw-gamma-j
    BSV: mm-c118-bsv-gamma-j
    # IDOS moved to the MM4 desk 2026-10-01 — removed from this roster.
    CHECK: mm_c415_check_gamma-j
    GENIUS: mm-h014_genius-gamma-j
    BILL: mm-c422_bill-gamma-j
    NOCK: mm-h016_nock-gamma-j
    SKL: mm-c427_skl-gamma-j
    QUID: mm-h018_quid-gamma-j
    TGBP: MM-C374_tGBP-GAMMA-J
    AEDZ: mm-c397-aedz-gamma-j
    # Added 2026-09-09, hours after listing, on the owner's instruction that it belongs to the
    # MM3 book. ⚠️ RDS disagrees: all 19 of its active locations are tagged `desk=MM2`
    # (KUCOIN/KRAKEN/BINANCE/OKX/BYBIT/BITGET/GATEIO/COINBASE/BITVAVO/MEXC) and today's 319 fills
    # landed on those MM2-tagged accounts. The strategy owns its accounts, so placing from the MM3
    # chat still trades the right book -- but until RDS is re-tagged, LAPTOP flow appears in MM2's
    # flow alerts and `/trade today`, not MM3's. Same shape as the DECIBEL mandate (traded by MM3,
    # still registered desk=MM5), which is pinned by id in flow_alert_bot._PINNED_LOCATIONS.
    # Without this entry `/trade laptop ...` fell through to the desk PERP book and would have
    # placed LAPTOP-USDT.PERP instead of spot gamma.
    # ⚠️ Blocked CoinRoutes-side: the strategy's `users` list is humans only, so `bot_mm3user`
    # must be added to it before a placement can succeed (it 400s until then).
    # Deliberately NOT in DEFAULT_QTY: no default means USD-denominated sizing only, capped by
    # the desk max_usd -- the right rails for a listing whose first 12h printed 0.79 to 5.21.
    LAPTOP: mm-h021_laptop-gamma-j
    # AI = GENSYN. Two unrelated tokens share the ticker 'AI' on different exchanges:
    #   Gensyn (ours) -> okex, kucoin, bitget (~0.0209); on Binance ours is AIGENSYN-USDT
    #   the other AI  -> binance, huobi       (~0.0179)
    # Their 4h returns correlate only 0.28, so a price from the wrong venue is a wrong
    # ASSET, not a stale quote. This strategy has BINANCE and HUOBI configured alongside
    # okex/kucoin/bitget, so an unpinned order could execute against the wrong coin —
    # pinned in trade_bot.TOKEN_VENUES (orders + market data + book) and
    # trade_plot._TOKEN_VENUES (candles). Durable fix is CoinRoutes-side: drop
    # BINANCE/HUOBI from this strategy's book sources in the UI.
    AI: mm-c420_ai-gamma-j
    # Added 2026-09-30 on the owner's instruction: traded from MM3 even though CoinRoutes names
    # the strategy mm5-* (ignore the prefix). Hyperliquid-only, and the book is a USDC perp,
    # BVIVMKTS-USDC.PERP, not BVIV-USDT spot -- trade_bot.PAIR_OVERRIDE supplies that pair.
    # ⚠️ Blocked CoinRoutes-side like LAPTOP: the strategy's `users` list is humans only, so
    # `bot_mm3user` must be added before a placement can succeed (it 400s until then).
    # Not in DEFAULT_QTY: USD sizing only, capped by the desk max_usd.
    BVIV: mm5-bviv-gamma-j
    # Added 2026-10-01 on the owner's instruction. Plain spot HEMI-USDT (binance/gateio/mexc).
    # ⚠️ Blocked CoinRoutes-side until `bot_mm3user` is added to the strategy's `users`.
    # Not in DEFAULT_QTY: USD sizing only, capped by the desk max_usd.
    HEMI: mm-c416_hemi-gamma-j
    # Same asset, same account, second symbol: Binance calls Gensyn AIGENSYN-USDT because
    # its own AI-USDT is the other token. Both codes live on mm-c420_ai-gamma-j.
    AIGENSYN: mm-c420_ai-gamma-j
    # ⚠️ `bot_mm3user` is not in this strategy's `users` list (checked 2026-09-29), so
    # `/trade xdp` placements 400 until it is added CoinRoutes-side. Read-only bots are unaffected.
    XDP: mm-c438_xdp-gamma-j
  agg:
    label: "MM3 Aggregator · Dashboard"
    sheet: 1V7QrpPY-24JMXJKrT69yGLRc8ZLk6jyfLOlobaTPi4s
    gid: 0
  bots:
    - "*MM3_JASONDH"
    - "*MM3_REGIME_TRADING_CANIO"

