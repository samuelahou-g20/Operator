# Funding-carry v3.0 — v2.1 selection + RISK-AWARE SIZING (inverse basis-vol).
# Same score + basis-blowout veto + breadth as v2.1; the only change is weighting: size the held set
# by 1/basis_vol (risk parity on the delta-neutral leg) instead of equal weight. This up-weights the
# clean-basis names and down-weights volatile ones — full-universe net Sharpe ~5.7 (vs v2.1's 5.4)
# and, critically, the most out-of-sample-robust variant (train 21-23 Sh 5.8 -> test 24-26 Sh 6.7),
# well diversified (avg max weight ~6%, effective N ~88, so no weight cap needed). Trade-off: inverse-
# vol churns more (turnover 20->26x) so the 2x-cost Sharpe is lower (~2.5, still >>0.5) — a no-trade
# weight band to cut that is deferred to v3.1. Knobs/veto unchanged from v2.1; validate held-out.

name: funding_carry
version: v3.0
source: binance

universe: all

signal:
  ewma_halflife: 7
  theta_in_apr: 0.08
  theta_keep_apr: 0.02

selection:
  k_in: null                  # breadth preserved (no rank cap)
  k_keep: null

features:
  - {name: funding_vol, window: 30}
  - {name: neg_freq,    window: 30}
  - {name: basis,       window: 30}   # basis dislocation gauge (for the veto)
  - {name: basis_vol,   window: 30}   # basis-return vol (for the veto is optional; used for SIZING)

veto:
  - {feature: funding_vol, direction: max, cap: 0.75}
  - {feature: neg_freq,    direction: max, cap: 0.40}
  - {feature: basis,       direction: max, cap: 0.01}

sizing:
  scheme: inv_vol             # weight held names ∝ 1/vol_feature, renormalized
  vol_feature: basis_vol      # the engine feature to size on (built above)

costs:
  spot_taker: 0.0010
  perp_taker: 0.0005
  spot_maker: 0.0010
  perp_maker: 0.0002
  slippage_per_leg: 0.0002
  holding_per_day: 0.0

backtest:
  start: "2021-01-01"
  end: "2026-05-31"
  timeframe: "1h"
  rebalance: "1D"
  warmup_days: 30
  cost_stress_mult: [1.0, 2.0]
