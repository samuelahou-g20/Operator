# Funding-carry v6.1 — CVaR TAIL-LOSS SIZING (blended with inverse-basis-vol).
# Strategy = v6.0 (min-age veto); the ONE change is sizing: held weights = 50/50 blend of inverse
# basis-vol and inverse CVaR (engine `cvar` feature = rolling mean of the worst 5% of the name's own
# daily pair return F+L over 60d; weights winsorized cross-sectionally at the 0.90 quantile — the
# clip is load-bearing, un-clipped a near-zero-tail name dominates the book).
# Research (v6_selection_refinements/cvar_sizing.ipynb, on the v3.1 stack): CVaR sees funding flips +
# basis blowouts that symmetric basis-vol misses; 60d blend lifts IS Sh 6.32->6.46, Sh@2x 3.62->3.97,
# turnover 20.5->18.6; frozen test 2024-26 Sh 7.52->8.02, Sh@2x 4.32->5.36. Robust across the 45-90d
# window plateau (30d can't estimate a 5% tail, 120d stale) and 0.8-0.95 clip. Config-only (v4 code):
#   uv run python -m src.strategies.funding_carry.v4.backtest --config strategies/funding_carry/v6.1.yaml

name: funding_carry
version: v6.1
source: binance

universe: all

signal:
  ewma_halflife: 7
  theta_in_apr: 0.08
  theta_keep_apr: 0.02

selection:
  k_in: null
  k_keep: null

features:
  - {name: funding_vol, window: 30}
  - {name: neg_freq,    window: 30}
  - {name: basis,       window: 30}
  - {name: basis_vol,   window: 30}
  - {name: age}
  - {name: cvar,        window: 60}

veto:
  - {feature: funding_vol, direction: max, cap: 0.75}
  - {feature: neg_freq,    direction: max, cap: 0.40}
  - {feature: basis,       direction: max, cap: 0.01}
  - {feature: age,         direction: min, cap: 15}

sizing:
  scheme: blend               # 50/50 inverse basis-vol + inverse CVaR
  vol_feature: basis_vol
  cvar_feature: cvar
  cvar_clip: 0.90
  band: 0.5

overlay:
  qexit: 0.15
  qreenter: 0.50
  lookback: 252

margin:
  mode: portfolio             # spot collateralizes the perp (one venue / Binance Portfolio Margin)
  reserve: 0.0
  collateral_default: 0.5
  collateral_overrides:
    btcusdt: 0.95
    ethusdt: 0.95
    bnbusdt: 0.80
    solusdt: 0.80
    xrpusdt: 0.80
    adausdt: 0.80
    dogeusdt: 0.80
    ltcusdt: 0.80
    linkusdt: 0.80
    dotusdt: 0.80
  mmr_default: 0.02
  mmr_overrides:
    btcusdt: 0.004
    ethusdt: 0.004
    bnbusdt: 0.01
    solusdt: 0.01
    xrpusdt: 0.01
    adausdt: 0.01
    dogeusdt: 0.01
    ltcusdt: 0.01
    linkusdt: 0.01
    dotusdt: 0.01

costs:
  spot_taker: 0.0010
  perp_taker: 0.0005
  spot_maker: 0.0010
  perp_maker: 0.0002
  slippage_per_leg: 0.0002
  holding_per_day: 0.0

backtest:
  start: "2021-01-01"
  end: "2026-05-31"
  timeframe: "1h"
  rebalance: "1D"
  warmup_days: 30
  cost_stress_mult: [1.0, 2.0]
