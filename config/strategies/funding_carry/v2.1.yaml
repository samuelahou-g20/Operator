# Funding-carry v2.1 — v2.0 + BASIS-BLOWOUT veto (the attributed risk lever).
# Diagnosis (research/funding_carry/holdout.py): v1's whole-band equal-weight underperforms the
# majors because a small toxic-basis tail (~5 names, basis-vol 10-30x the majors) dominates
# portfolio variance, and the funding score ranks the clean majors ~110th so it never prefers them.
# Vetoing names whose perp-spot basis is dislocated (>1%) removes that tail (122 -> ~117 names,
# breadth preserved) and lifts net Sharpe 1.53 -> ~5 with DD -10% -> -3%, robust out-of-sample
# (train 21-23 Sh 5.9 -> test 24-26 Sh 3.3). Knobs (theta/hl) unchanged; caps are conservative,
# validate held-out. NOTE: inverse-basis-vol WEIGHTING is an even more OOS-robust lever (Sh ~5.1
# on 24-26) — a v3 risk-aware-sizing candidate, not added here.

name: funding_carry
version: v2.1
source: binance

universe: all

signal:
  ewma_halflife: 7
  theta_in_apr: 0.08
  theta_keep_apr: 0.02

selection:
  k_in: null                  # breadth preserved (no rank cap)
  k_keep: null

features:
  - {name: funding_vol, window: 30}
  - {name: neg_freq,    window: 30}
  - {name: basis,       window: 30}   # rolling mean |perp-spot|/spot (basis dislocation gauge)

veto:
  - {feature: funding_vol, direction: max, cap: 0.75}
  - {feature: neg_freq,    direction: max, cap: 0.40}
  - {feature: basis,       direction: max, cap: 0.01}    # exclude names whose basis sits dislocated >1%

costs:
  spot_taker: 0.0010
  perp_taker: 0.0005
  spot_maker: 0.0010
  perp_maker: 0.0002
  slippage_per_leg: 0.0002
  holding_per_day: 0.0

backtest:
  start: "2021-01-01"
  end: "2026-05-31"
  timeframe: "1h"
  rebalance: "1D"
  warmup_days: 30
  cost_stress_mult: [1.0, 2.0]
