# Funding-carry v8.1 — IDLE-CASH YIELD on the FULL BOOK (capacity configuration).
# Strategy = v7.1 (multi-venue full book); the ONE change is the `cash` block: idle cash (which is
# binary — the v4 overlay fully out, 21% of days, ~all of 2022 + early 2023) is credited at the
# 3M T-bill rate × capture. Research (v8_cash_yield/cash_yield.ipynb): +0.5-0.6%/yr, Calmar up for
# all books, 2022 flips ~0% -> +2.0%; for THIS book maxDD also shrinks (-1.11% -> -0.88%; its 2022 stretch
# was the deepest underwater run). Sharpe is computed as (E[r] − E[rf]) / vol(r) everywhere —
# ratios that ignore rf are not reported (they are not Sharpe ratios).
# rf comes from the lake: fred/tb3ms (see v8.yaml for the FRED backfill commands).
# capture 0.75 = on-venue Simple-Earn-style capture; off-venue T-bills during overlay-out ≈ 1.0.
#   uv run python -m src.strategies.funding_carry.v8.backtest --config strategies/funding_carry/v8.1.yaml

name: funding_carry
version: v8.1

sources: [binance, bybit]
universe:
  binance: all
  bybit: all

signal:
  ewma_halflife: 7
  theta_in_apr: 0.08
  theta_keep_apr: 0.02

selection:
  k_in: null
  k_keep: null

features:
  - {name: funding_vol, window: 30}
  - {name: neg_freq,    window: 30}
  - {name: basis,       window: 30}
  - {name: basis_vol,   window: 30}
  - {name: age}
  - {name: cvar,        window: 60}

veto:
  - {feature: funding_vol, direction: max, cap: 0.75}
  - {feature: neg_freq,    direction: max, cap: 0.40}
  - {feature: basis,       direction: max, cap: 0.01}
  - {feature: age,         direction: min, cap: 15}

sizing:
  scheme: blend
  vol_feature: basis_vol
  cvar_feature: cvar
  cvar_clip: 0.90
  band: 0.5

overlay:
  qexit: 0.15
  qreenter: 0.50
  lookback: 252

cash:
  capture: 0.75
  rf_series: {source: fred, symbol: tb3ms}

margin:
  mode: portfolio             # per-venue uniMMR; venues fall back to the maps below (see v7.yaml)
  reserve: 0.0
  collateral_default: 0.5
  collateral_overrides:
    btcusdt: 0.95
    ethusdt: 0.95
    bnbusdt: 0.80
    solusdt: 0.80
    xrpusdt: 0.80
    adausdt: 0.80
    dogeusdt: 0.80
    ltcusdt: 0.80
    linkusdt: 0.80
    dotusdt: 0.80
  mmr_default: 0.02
  mmr_overrides:
    btcusdt: 0.004
    ethusdt: 0.004
    bnbusdt: 0.01
    solusdt: 0.01
    xrpusdt: 0.01
    adausdt: 0.01
    dogeusdt: 0.01
    ltcusdt: 0.01
    linkusdt: 0.01
    dotusdt: 0.01

costs:
  spot_taker: 0.0010
  perp_taker: 0.0005
  spot_maker: 0.0010
  perp_maker: 0.0002
  slippage_per_leg: 0.0002
  holding_per_day: 0.0

backtest:
  start: "2021-01-01"
  end: "2026-05-31"
  timeframe: "1h"
  rebalance: "1D"
  warmup_days: 30
  cost_stress_mult: [1.0, 2.0]
