# Funding-carry v7.1 — MULTI-VENUE FULL BOOK (all venue-instances; the capacity configuration).
# Strategy = v7.0; the ONE change is `bybit: all` — overlap coins trade on BOTH venues as separate
# assets (two independent same-venue delta-neutral books per coin; the sizing normalizes weights).
# Research (v7_cross_venue/): the full book retains most of the breadth Sharpe uplift (OOS 2x 5.80)
# AND doubles the 5%-ADV budget on ~220 overlap coins -> capacity ceiling moves ~$20-30M -> ~$40M+
# (at $30M: 2x-cost Sharpe 2.48 -> 3.42, Calmar 1.18 -> 2.17). Use v7.0 for Sharpe at modest AUM,
# this config to scale past ~$30M.
#   uv run python -m src.strategies.funding_carry.v4.backtest --config strategies/funding_carry/v7.1.yaml

name: funding_carry
version: v7.1

sources: [binance, bybit]
universe:
  binance: all
  bybit: all

signal:
  ewma_halflife: 7
  theta_in_apr: 0.08
  theta_keep_apr: 0.02

selection:
  k_in: null
  k_keep: null

features:
  - {name: funding_vol, window: 30}
  - {name: neg_freq,    window: 30}
  - {name: basis,       window: 30}
  - {name: basis_vol,   window: 30}
  - {name: age}
  - {name: cvar,        window: 60}

veto:
  - {feature: funding_vol, direction: max, cap: 0.75}
  - {feature: neg_freq,    direction: max, cap: 0.40}
  - {feature: basis,       direction: max, cap: 0.01}
  - {feature: age,         direction: min, cap: 15}

sizing:
  scheme: blend
  vol_feature: basis_vol
  cvar_feature: cvar
  cvar_clip: 0.90
  band: 0.5

overlay:
  qexit: 0.15
  qreenter: 0.50
  lookback: 252

margin:
  mode: portfolio             # per-venue uniMMR; venues fall back to the maps below (see v7.yaml)
  reserve: 0.0
  collateral_default: 0.5
  collateral_overrides:
    btcusdt: 0.95
    ethusdt: 0.95
    bnbusdt: 0.80
    solusdt: 0.80
    xrpusdt: 0.80
    adausdt: 0.80
    dogeusdt: 0.80
    ltcusdt: 0.80
    linkusdt: 0.80
    dotusdt: 0.80
  mmr_default: 0.02
  mmr_overrides:
    btcusdt: 0.004
    ethusdt: 0.004
    bnbusdt: 0.01
    solusdt: 0.01
    xrpusdt: 0.01
    adausdt: 0.01
    dogeusdt: 0.01
    ltcusdt: 0.01
    linkusdt: 0.01
    dotusdt: 0.01

costs:
  spot_taker: 0.0010
  perp_taker: 0.0005
  spot_maker: 0.0010
  perp_maker: 0.0002
  slippage_per_leg: 0.0002
  holding_per_day: 0.0

backtest:
  start: "2021-01-01"
  end: "2026-05-31"
  timeframe: "1h"
  rebalance: "1D"
  warmup_days: 30
  cost_stress_mult: [1.0, 2.0]
