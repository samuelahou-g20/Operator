# Funding-carry v0 — minimal baseline (ARCHITECTURE §3, §11). See
# src/strategies/funding_carry/README.md. v0 = long spot / short USD-M perp, delta-neutral,
# hold-ALL-passing a trailing-APR cost gate, equal weight, daily rebalance (stateless).

name: funding_carry
version: v0
source: binance

# Base symbols; each held as +spot / -perp of equal notional (delta-neutral).
universe: [btcusdt, ethusdt, bnbusdt, xrpusdt, solusdt]

signal:
  apr_window_days: 7        # trailing window for the annualized funding estimate
  gate_breakeven_days: 30   # max break-even horizon -> APR floor = c_rt*365/30
  max_n: null               # null = hold ALL names passing the gate

# Costs as fractions of notional. v0 uses market orders -> taker. Binance VIP-0
# (owner-confirmed): spot 0.10%/0.10%, USD-M perp 0.02%/0.05% (maker/taker).
costs:
  spot_taker: 0.0010
  perp_taker: 0.0005
  spot_maker: 0.0010        # recorded for a future maker-execution variant
  perp_maker: 0.0002
  slippage_per_leg: 0.0002  # assumption (majors, modest size)
  holding_per_day: 0.0      # h: collateral financing / borrow; 0 for v0 (revisit Layer C)

backtest:
  start: "2021-01-01"
  end: "2026-05-31"
  timeframe: "1h"           # source bars; daily close-to-close used for leg P&L
  rebalance: "1D"
  warmup_days: 7            # drop the partial-signal-window warmup from measurement
  cost_stress_mult: [1.0, 2.0]   # success requires net>0 still at 2x cost
