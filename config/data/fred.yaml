# FRED macro-series fetcher config (ARCHITECTURE §3). Official API (api.stlouisfed.org) —
# the public fredgraph CSV endpoint is not reachable from this network.
# Credentials: only the env-var NAME is referenced (never the key itself). The key is free:
# https://fred.stlouisfed.org/docs/api/api_key.html
#
# tb3ms = 3-month T-bill (monthly, percent p.a.) — the funding-carry risk-free rate used by
# the v8 cash-yield credit and the excess-Sharpe reporting (engine `cash.rf_series`).

vendor: fred
rest_url: "https://api.stlouisfed.org"
api_key_env: "FRED_API_KEY"

data_types:
  rates:
    storage: small          # one tiny file per series

backfill:
  symbols: ["tb3ms"]
